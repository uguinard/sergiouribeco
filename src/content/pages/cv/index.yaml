skills.en:
  - "Dual-Language Methodology: IB Pedagogical Frameworks, EAL/ESL Scaffolding, Academic Literacy, Reading Comprehension, Comprehensible Input, CEFR A1–C1, 4E Cognition, DELE Exam Prep."
  - "Pastoral & Extracurricular: Homeroom Advisory, Restorative Communication, SEL (Social Emotional Learning), Digital Storytelling, Reading & Creative Writing Clubs."
  - "EdTech & LMS: Canvas, ManageBac, Moodle, Blackboard, Google Workspace, H5P (Advanced), AI-generated pedagogical pipelines."
  - "Programming: Python 3, HTML5, CSS3, JavaScript (Custom EdTech resource development)."
  - "Safeguarding: Enhanced DBS-equivalent (Turkey, Spain); clean police clearances available for all countries of residence."
skills.es:
  - "Metodología de doble idioma: marcos pedagógicos del IB, andamiaje EAL/ESL, alfabetización académica, comprensión lectora, input comprensible, MCER A1-C1, cognición 4E, preparación de exámenes DELE."
  - "Pastoral y extracurricular: tutoría, comunicación restaurativa, SEL (aprendizaje social y emocional), narrativa digital, clubes de lectura y escritura."
  - "EdTech y LMS: Canvas, ManageBac, Moodle, Blackboard, Google Workspace, H5P (avanzado), pipelines de aprendizaje."
  - "Programación: Python 3, HTML5, CSS3, JavaScript."
  - "Protección: Equivalente a DBS mejorado (Turquía, España); certificados de antecedentes penales limpios disponibles."
