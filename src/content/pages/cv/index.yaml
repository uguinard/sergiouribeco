name: "Sergio Uribe Guinard"
role.en: "IB-Certified Dual-Language Educator (Spanish & EAL) · EdTech Innovator"
role.es: "Educador de Idiomas Certificado IB (Español y EAL) · Innovador EdTech"
location: "Da Nang, Vietnam"
availableFrom: "July 2026"
linkedin: "https://linkedin.com/in/sergiouribe"
