marginalia:
  emotional.en: "The overwhelming feeling of being small, yet deeply connected to the earth."
  emotional.es: "El sentimiento sobrecogedor de ser pequeño, y sin embargo, profundamente conectado con la tierra."
  philosophical.en: "Silence is not the absence of sound, but the presence of meaning."
  philosophical.es: "El silencio no es la ausencia de sonido, sino la presencia de significado."
  pedagogical.en: "How can we design learning spaces that embrace silence instead of constant stimulation?"
